services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: conciliapix
      POSTGRES_DB: conciliapix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - identity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliapix -d conciliapix"]
      interval: 3s
      timeout: 3s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
volumes:
  identity_pg:
